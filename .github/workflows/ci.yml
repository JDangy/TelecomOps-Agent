# 最小 CI：安装依赖 + submodule + 确定性测试（无 LLM / 无 API key / 不跑 benchmark）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deterministic unit tests (runtime mechanisms)
        run: python tests/test_unit.py

      - name: Benchmark integrity tests
        run: python tests/test_integrity.py
